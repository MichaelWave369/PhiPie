name: Host health episodes

on:
  push:
  pull_request:

jobs:
  host-health-episodes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run host health episode tests
        run: python -m unittest discover -s tests -p "test_health_episodes.py" -v
      - name: Re-run Pi health baseline tests
        run: python -m unittest discover -s tests -p "test_pi_health_baseline.py" -v
      - name: Re-run Pi telemetry tests
        run: python -m unittest discover -s tests -p "test_pi_telemetry.py" -v
