name: Physical host I/O boundary

on:
  push:
  pull_request:

jobs:
  physical-host-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run physical host I/O boundary tests
        run: python -m unittest discover -s tests -p "test_physical_host_io.py" -v
      - name: Re-run simulator regression tests
        run: python -m unittest discover -s tests -p "test_physical_host.py" -v
