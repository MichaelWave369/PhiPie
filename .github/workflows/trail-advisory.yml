name: PhiPie Trail advisory prototype

on:
  push:
    paths:
      - 'experiments/trail/**'
      - '.github/workflows/trail-advisory.yml'
  pull_request:
    paths:
      - 'experiments/trail/**'
      - '.github/workflows/trail-advisory.yml'

jobs:
  offline-trail-advisory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline tests (no physical or network adapters)
        working-directory: experiments/trail
        run: python -m unittest discover -s tests -v
      - name: Verify deterministic demo outcomes
        working-directory: experiments/trail
        run: |
          python -m trailcore.demo nominal > /tmp/trail-nominal.json
          python -m trailcore.demo degraded > /tmp/trail-degraded.json
          python -m trailcore.demo stale > /tmp/trail-stale.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {'nominal': 'REVIEW_CANDIDATE', 'degraded': 'HOLD', 'stale': 'HOLD'}
          for scenario, state in expected.items():
              result = json.loads(Path(f'/tmp/trail-{scenario}.json').read_text())
              assert result['state'] == state, (scenario, result['state'])
              for field in ('physical_deployment_authorized', 'rover_motion_authorized', 'network_config_change_authorized', 'authenticated_end_to_end_proof'):
                  assert result[field] is False, (scenario, field)
          PY

      - name: Verify ΦSOMA synthetic signed sensor -> Trail advisory handoff
        working-directory: experiments/trail
        run: |
          python -m trailcore.soma_demo > /tmp/soma-lab.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/soma-lab.json').read_text())
          assert r['mode'] == 'OFFLINE_SYNTHETIC_READ_ONLY'
          assert r['receipt']['authentication'] == 'LAB_KEYRING_HMAC_ONLY'
          assert r['receipt']['somaRuntimeWired'] is False
          assert r['corridor']['state'] == 'REVIEW_CANDIDATE'
          for k in ('physical_deployment_authorized', 'rover_motion_authorized', 'network_config_change_authorized', 'authenticated_end_to_end_proof'):
              assert r['corridor'][k] is False, k
          PY

      - name: Verify radio observer's CLI refuses unsupported host (offline)
        working-directory: experiments/trail
        run: |
          python -m trailcore.radio_cli --list > /tmp/trail-radio-list.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/trail-radio-list.json').read_text())
          assert r['readonly'] is True
          assert r['motor_authority'] is False
          assert r['network_change_authority'] is False
          assert r['physical_deployment_authority'] is False
          assert r['status'] in ('HOLD', 'OBSERVED')
          PY

      - name: Two-node pilot CLI help (no network, no field keys)
        working-directory: experiments/trail
        run: |
          python -m trailcore.two_node_cli --help > /tmp/trail-two-node-help.txt
          grep -q "init-ledger" /tmp/trail-two-node-help.txt
          grep -q "receive" /tmp/trail-two-node-help.txt

      - name: Validate field witness CLI without hardware
        working-directory: experiments/trail
        run: |
          python -m trailcore.field_cli --help > /tmp/trail-field-help.txt
          grep -q "assess" /tmp/trail-field-help.txt
          python - <<'PY'
          from trailcore.field_witness import template, assess_witness
          result = assess_witness(template())
          assert result['status'] == 'HOLD'
          assert result['hardware_physically_qualified'] is False
          assert result['mesh_transport_verified'] is False
          assert result['action_authorized'] is False
          PY

      - name: Verify local-only evidence binder CLI with no physical hardware
        working-directory: experiments/trail
        run: |
          python -m trailcore.evidence_cli --help > /tmp/trail-bind-help.txt
          grep -q "inspect" /tmp/trail-bind-help.txt
          python - <<'PY'
          from trailcore.evidence_binding import manifest_template, verify_local_bundle
          from trailcore.field_witness import template
          manifest = manifest_template()
          r = verify_local_bundle(template(), manifest, '/not-a-real-private-evidence-dir')
          assert r['status'] == 'HOLD'
          assert r['physical_hardware_qualified'] is False
          assert r['hmac_cryptographically_verified'] is False
          assert r['network_change_authorized'] is False
          PY

      - name: Verify bounded probe and eight-file binder refusal offline
        working-directory: experiments/trail
        run: |
          python -m trailcore.path_probe_cli --help > /tmp/trail-probe-help.txt
          python -m trailcore.probe_bundle_cli --help > /tmp/trail-bundle-help.txt
          grep -q "approve-probe" /tmp/trail-probe-help.txt
          python - <<'PY'
          from trailcore.path_probe import collect_icmp_pair
          from trailcore.probe_bundle import probe_manifest_template, verify_probe_bundle
          from trailcore.field_witness import template
          class NeverRun:
              def run(self, *args, **kw):
                  raise RuntimeError("unapproved probe tried to execute")
          result = collect_icmp_pair("192.168.1.1", "wlan0", approved=False, runner=NeverRun())
          assert result['status'] == 'HOLD'
          m = probe_manifest_template()
          assert len(m['files']) == 8
          review = verify_probe_bundle(template(), m, '/no-private-field-evidence')
          assert review['status'] == 'HOLD'
          assert review['physical_hardware_qualified'] is False
          assert review['network_change_authorized'] is False
          PY

      - name: Refuse unapproved TCP and verify nine-file binder CLI offline
        working-directory: experiments/trail
        run: |
          python -m trailcore.tcp_cli --help > /tmp/trail-tcp-help.txt
          python -m trailcore.tcp_bundle_cli --help > /tmp/trail-tcp-binder-help.txt
          grep -q "approve-tcp" /tmp/trail-tcp-help.txt
          python - <<'PY'
          from trailcore.tcp_observer import observe_tcp
          from trailcore.tcp_bundle import tcp_manifest_template, verify_tcp_bundle
          from trailcore.field_witness import template
          class NeverRun:
              def run(self, *a, **kw):
                  raise RuntimeError("unapproved TCP probe executed")
          denied = observe_tcp("192.168.1.20", approved=False, runner=NeverRun())
          assert denied["status"] == "HOLD"
          assert len(tcp_manifest_template()["files"]) == 9
          result = verify_tcp_bundle(template(), tcp_manifest_template(), "/no-field-dir")
          assert result["status"] == "HOLD"
          assert result["hardware_qualified"] is False
          assert result["network_change_authorized"] is False
          PY
