name: Physical host simulator

on:
  push:
  pull_request:

jobs:
  physical-host-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run physical host simulator tests
        run: python -m unittest discover -s tests -p "test_physical_host.py" -v
      - name: Run healthy negative-control demo
        run: python -m runtime.physical_host.cli --scenario network_loss
      - name: Run protect-path demo
        run: python -m runtime.physical_host.cli --scenario thermal_protect
